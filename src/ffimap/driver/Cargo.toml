# The rustc driver behind `ffimap`: a HIR/typeck pass over a crate's FFI and
# unsafe surface. Uses rustc_private, so it builds only on the pinned nightly.
[package]
name = "ffimap-driver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ffimap-driver"
path = "src/main.rs"

# The driver is a workspace of its own, wherever its sources sit: under a
# directory that holds another Cargo workspace, a copy inside a scanned tree
# for one, cargo would otherwise refuse to build a package that workspace does
# not list.
[workspace]
